<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Пик по скиллу</title>
<style>html,body{background:#121821;color:#e9e3d5;font-family:system-ui,sans-serif;margin:0}p{padding:40px 16px;text-align:center;opacity:.7}</style>
</head>
<body>
<p>Загружаю свежую версию…</p>
<script>
// Always load the newest version of the page, skipping the browser cache
fetch("app.html?v=" + Date.now(), {cache: "no-store"})
  .then(r => { if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(t => { document.open(); document.write(t); document.close(); })
  .catch(() => { location.href = "app.html"; });
</script>
</body>
</html>
